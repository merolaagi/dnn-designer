<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muse">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="/m/manifest.json">
<link rel="icon" href="/m/icon.svg">
<link rel="apple-touch-icon" href="/m/icon.svg">
<title>Muse</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2329; --muted:#6b7380; --line:#e3e1da; --accent:#1f3a5f;
  --accent-ink:#ffffff; --soft:#eef1f5; --good:#2f7d4f; --bad:#b4442f; --warn:#a86b12; --me:#1f3a5f;
  --radius:14px; color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --card:#1c2026; --ink:#e8eaed; --muted:#9aa3ae; --line:#2b3038; --accent:#8fb3e0;
    --accent-ink:#0f1a28; --soft:#232933; --good:#6cc08f; --bad:#e3826e; --warn:#e0b25a; --me:#2c4a70;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:none;padding:6px 8px;border-radius:10px;font-size:15px;color:var(--accent);cursor:pointer}
.icon-btn:active{background:var(--soft)}
main{padding:12px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:2px;cursor:pointer;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10.5px;
  padding:0 5px;min-width:16px;line-height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 10px}
.list .row{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin:0 0 8px;cursor:pointer}
.row .t{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px}
.muted{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:550}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.bubble{border-radius:16px;padding:10px 13px;margin:10px 0;max-width:92%;word-wrap:break-word}
.bubble.me{background:var(--me);color:#fff;margin-left:auto;border-bottom-right-radius:5px;white-space:pre-wrap}
.bubble.it{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.phase{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--muted);margin-right:3px;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.steps{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.steps li{padding:2px 0}
.steps b{color:var(--ink);font-weight:600}
.ask{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--card));border-radius:var(--radius);padding:12px;margin:8px 0}
.ask pre{white-space:pre-wrap;font-size:12.5px;max-height:160px;overflow:auto;margin:6px 0 0}
.composer{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:6;background:var(--bg);
  border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{resize:none;min-height:44px;max-height:140px;border-radius:22px;padding:11px 16px}
.composer .round{flex:none;width:44px;height:44px;border-radius:22px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.composer .send{background:var(--accent);color:var(--accent-ink)}
.composer .mic{background:var(--soft);color:var(--ink)}
.composer .mic.on{background:var(--bad);color:#fff}
.with-composer main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.md{font-size:15.5px}
.md h1,.md h2,.md h3,.md h4{font-size:16px;margin:12px 0 4px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:20px}
.md code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:13.5px}
.md pre{background:var(--soft);padding:10px;border-radius:10px;overflow:auto;font-size:13px}
.md pre code{background:none;padding:0}
.md .tw{overflow-x:auto;margin:8px 0}
.md table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.md th,.md td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.md th{color:var(--muted);font-weight:600}
.md td.n{text-align:right;font-variant-numeric:tabular-nums}
.kind{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:1px 6px;margin-right:6px}
.kind.alert,.kind.error{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.kind.recovered,.kind.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.kind.approval{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.kind.stopped,.kind.skipped{background:var(--soft);color:var(--muted)}
.unread .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--accent);margin-right:6px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <button class="icon-btn hidden" id="back" aria-label="Back">‹ Back</button>
  <h1 id="title">Muse</h1>
  <button class="icon-btn hidden" id="newChat">New</button>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<div class="composer hidden" id="composer">
  <button class="round mic" id="mic" aria-label="Speak" title="Speak"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <textarea id="msg" rows="1" placeholder="Ask Muse…" aria-label="Message"></textarea>
  <button class="round send" id="send" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>
<nav id="nav" class="hidden">
  <button data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask</button>
  <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>Scan</button>
  <button data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10.3 20a2 2 0 0 0 3.4 0"/></svg>Inbox<span class="badge hidden" id="badge"></span></button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
</nav>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {tab: "ask", conv: null, timer: null, convs: [], me: null, pending: {}};

async function api(path, opts = {}){
  const r = await fetch(path, {credentials: "same-origin", ...opts,
    headers: {"content-type": "application/json", ...(opts.headers || {})}});
  let d = null;
  try{ d = await r.json(); } catch {}
  if (r.status === 401 && d && d.detail && d.detail.auth){ showLogin(); throw new Error("signin"); }
  if (!r.ok) throw new Error((d && d.detail && d.detail.message) || `The server said ${r.status}.`);
  return d;
}
const post = (path, body) => api(path, {method: "POST", body: JSON.stringify(body || {})});

/* ---------- a small Markdown reader: headings, lists, tables, code, bold ---------- */
function inline(t){
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = [];
  let i = 0;
  const num = c => /^[-+$]?[\d,]+(\.\d+)?%?$/.test(c.trim());
  while (i < lines.length){
    const l = lines[i];
    if (/^```/.test(l)){
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])){
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tw"><table><tr>${head.map(h => `<th>${inline(h)}</th>`).join("")}</tr>${rows.map(r =>
        `<tr>${r.map(c => `<td${num(c) ? ' class="n"' : ""}>${inline(c)}</td>`).join("")}</tr>`).join("")}</table></div>`);
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h){ out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); i++; continue; }
    if (/^\s*([-*•]|\d+[.)])\s+/.test(l)){
      const ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ""));
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!l.trim()){ i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*([-*•]|\d+[.)])\s+|\s*\|.*\|\s*$)/.test(lines[i])) para.push(lines[i++]);
    if (!para.length) para.push(lines[i++]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return `<div class="md">${out.join("")}</div>`;
}
const ago = t => { const s = Math.max(0, Date.now() / 1000 - t); return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago`
  : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(t * 1000).toLocaleDateString(); };

/* ---------- signing in ---------- */
function chrome(title, {back = false, composer = false, newChat = false} = {}){
  $("title").textContent = title;
  $("back").classList.toggle("hidden", !back);
  $("newChat").classList.toggle("hidden", !newChat);
  $("composer").classList.toggle("hidden", !composer);
  document.body.classList.toggle("with-composer", composer);
  $("nav").classList.remove("hidden");
  document.querySelectorAll("nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
}
function showLogin(msg){
  clearInterval(S.timer);
  $("nav").classList.add("hidden"); $("composer").classList.add("hidden"); $("back").classList.add("hidden");
  $("newChat").classList.add("hidden"); $("title").textContent = "Muse";
  $("view").innerHTML = `<div class="card"><p style="margin:0 0 6px;font-weight:600">Sign in</p>
    <p class="muted" style="margin:0">With the same name and password as the Deep Network Designer.</p>
    <label for="un">Name</label><input id="un" autocomplete="username" autocapitalize="none">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="rowbtns"><button class="btn go" id="signin">Sign in</button></div><div class="err" id="lerr">${esc(msg || "")}</div></div>`;
  const go = async () => {
    try{ await post("/api/auth/login", {name: $("un").value, password: $("pw").value}); route(); }
    catch(e){ if (e.message !== "signin") $("lerr").textContent = e.message; }
  };
  $("signin").onclick = go; $("pw").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- routing ---------- */
const TABS = ["inbox", "me", "scan"];
function route(){
  clearInterval(S.timer);
  const h = location.hash.slice(1), m = h.match(/^conv=(\w+)/), dm = h.match(/^doc=(\w+)/);
  if (m){ S.tab = "ask"; return openConv(m[1]); }
  if (dm){ S.tab = "scan"; return openDoc(dm[1]); }
  S.tab = TABS.includes(h) ? h : "ask";
  if (S.tab === "inbox") return showInbox();
  if (S.tab === "me") return showMe();
  if (S.tab === "scan") return showScan();
  if (window.MUSE_VIEWS && window.MUSE_VIEWS[S.tab]) return window.MUSE_VIEWS[S.tab]();
  return showConvs();
}
window.addEventListener("hashchange", route);
document.querySelectorAll("nav [data-tab]").forEach(b => b.onclick = () => { location.hash = b.dataset.tab === "ask" ? "" : b.dataset.tab; route(); });
$("back").onclick = () => { location.hash = ""; route(); };
$("newChat").onclick = () => newConv();

/* ---------- Muse conversations ---------- */
async function showConvs(){
  chrome("Muse", {newChat: true});
  let d;
  try{ d = await api("/api/agentlab/conversations"); } catch(e){ if (e.message !== "signin") $("view").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  S.convs = d.conversations || [];
  $("view").innerHTML = `<div class="rowbtns" style="margin:0 0 12px"><button class="btn go" id="start" style="flex:1">Ask Muse something new</button></div>
    ${S.convs.length ? `<div class="list">${S.convs.map(c => `<button class="row" data-c="${esc(c.id)}"><span class="t">${esc(c.title)}</span>
      <span class="s">${c.agent === "Muse" ? "" : esc(c.agent) + " · "}${ago(c.updated)} · ${c.turns} ${c.turns === 1 ? "message" : "messages"}${c.status === "running" || c.status === "waiting" ? " · working…" : ""}</span></button>`).join("")}</div>`
      : `<div class="empty">Ask about your store, a model, a maths problem or anything else. Muse picks the agent.</div>`}`;
  $("start").onclick = () => newConv();
  $("view").querySelectorAll("[data-c]").forEach(b => b.onclick = () => { location.hash = "conv=" + b.dataset.c; });
}
async function newConv(){
  try{
    const c = await post("/api/agentlab/conversations", {agent: {kind: "muse", key: "muse"}, mode: "live"});
    location.hash = "conv=" + c.id;
  } catch(e){ if (e.message !== "signin") alert(e.message); }
}
function turnHtml(t, i, last){
  const live = ["running", "waiting"].includes(t.status);
  const steps = (t.muse_steps || []).map(s => `<li><b>${esc(s.name)}</b> · ${esc(s.status === "done" ? "done" : s.status || "")}</li>`).join("");
  const plan = t.plan && t.plan.understood ? `<div class="muted" style="margin-bottom:4px">${esc(t.plan.understood)}</div>` : "";
  const ask = last && S.pending[t.run] ? approvalHtml(S.pending[t.run]) : "";
  let body;
  if (live) body = `${plan}<div class="phase"><span class="dots"><i></i><i></i><i></i></span>${esc(t.phase || "Working")}</div>
      ${steps ? `<ul class="steps">${steps}</ul>` : ""}${ask}<div class="rowbtns"><button class="btn bad" data-stop="${esc(t.run || "")}"${t.run ? "" : " disabled"}>Stop</button></div>`;
  else if (t.status === "done") body = `${md(t.answer)}${(t.muse_steps || []).length > 1 ? `<ul class="steps">${steps}</ul>` : ""}${window.MUSE_TURN_EXTRA ? window.MUSE_TURN_EXTRA(t, i) : ""}`;
  else body = `<div class="err">${esc(t.error || ("It " + (t.status || "stopped") + "."))}</div>`;
  const long = (t.task || "").length > 360;
  const mine = long ? `<div class="bubble me"><span>${esc(t.task.slice(0, 280))}…</span><button class="icon-btn" data-more="${i}"
      style="color:#cfe0f5;padding:4px 0 0;display:block">Show all</button></div>` : `<div class="bubble me">${esc(t.task)}</div>`;
  return `${mine}<div class="bubble it">${body}</div>`;
}
function approvalHtml(p){
  let args = "";
  try{ args = JSON.stringify(p.args, null, 1); } catch {}
  return `<div class="ask"><b>Wants to use ${esc(p.tool)}</b><div class="muted">It waits for your answer.</div>
    ${args && args !== "{}" ? `<pre>${esc(args.slice(0, 1500))}</pre>` : ""}
    <div class="rowbtns"><button class="btn go" data-ans="1">Approve</button><button class="btn" data-ans="0">Decline</button></div></div>`;
}
async function openConv(id){
  S.conv = id;
  chrome("Muse", {back: true, composer: true});
  const draw = async () => {
    let c;
    try{ c = await api("/api/agentlab/conversations/" + id); } catch(e){ if (e.message !== "signin") $("view").innerHTML = `<div class="err">${esc(e.message)}</div>`; clearInterval(S.timer); return; }
    if (S.conv !== id) return;
    $("title").textContent = c.title || "Muse";
    const last = c.turns[c.turns.length - 1];
    S.turns = c.turns;
    const live = last && ["running", "waiting"].includes(last.status);
    if (live && last.run){
      try{ const v = await api(`/api/agentlab/runs/${last.run}/live?since=100000`); S.pending[last.run] = v.status === "waiting" ? v.pending : null; } catch {}
    }
    const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    $("view").innerHTML = c.turns.length ? c.turns.map((t, i) => turnHtml(t, i, i === c.turns.length - 1)).join("")
      : `<div class="empty">What do you need? Ask in your own words: “How did fuel do yesterday against last week?”</div>`;
    wire(last);
    $("send").disabled = !!live;
    if (atBottom || !S.drawn) window.scrollTo(0, document.body.scrollHeight);
    S.drawn = true;
    if (!live) clearInterval(S.timer);
  };
  const wire = last => {
    $("view").querySelectorAll("[data-more]").forEach(b => b.onclick = () => { b.parentElement.textContent = S.turns[+b.dataset.more].task; });
    $("view").querySelectorAll("[data-stop]").forEach(b => b.onclick = async () => { try{ await post(`/api/agentlab/runs/${b.dataset.stop}/stop`); } catch(e){ alert(e.message); } draw(); });
    $("view").querySelectorAll("[data-ans]").forEach(b => b.onclick = async () => {
      try{ await post(`/api/agentlab/runs/${last.run}/answer`, {approved: b.dataset.ans === "1"}); S.pending[last.run] = null; } catch(e){ alert(e.message); }
      draw();
    });
    if (window.MUSE_WIRE) window.MUSE_WIRE($("view"), id);
  };
  S.drawn = false;
  S.redraw = () => { clearInterval(S.timer); S.timer = setInterval(draw, 2500); draw(); };
  await draw();
  clearInterval(S.timer); S.timer = setInterval(draw, 2500);
}
async function send(){
  const text = $("msg").value.trim();
  if (!text || !S.conv) return;
  $("send").disabled = true;
  try{
    await post(`/api/agentlab/conversations/${S.conv}/say`, {text, mode: "live"});
    $("msg").value = ""; grow();
    S.redraw();
  } catch(e){ if (e.message !== "signin") alert(e.message); $("send").disabled = false; }
}
$("send").onclick = send;
const grow = () => { const t = $("msg"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; };
$("msg").oninput = grow;
$("msg").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !("ontouchstart" in window)){ e.preventDefault(); send(); } };

/* ---------- speaking instead of typing, where the browser can ---------- */
(function(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R){ $("mic").classList.add("hidden"); return; }
  let rec = null;
  $("mic").onclick = () => {
    if (rec){ rec.stop(); return; }
    rec = new R(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false;
    const start = $("msg").value ? $("msg").value.trim() + " " : "";
    rec.onresult = e => { $("msg").value = start + Array.from(e.results).map(r => r[0].transcript).join(""); grow(); };
    rec.onend = () => { rec = null; $("mic").classList.remove("on"); };
    rec.onerror = () => { rec = null; $("mic").classList.remove("on"); };
    $("mic").classList.add("on"); rec.start();
  };
})();

/* ---------- the inbox ---------- */
async function badge(){
  try{ const d = await api("/api/inbox"); $("badge").textContent = d.unread; $("badge").classList.toggle("hidden", !d.unread); return d; } catch { return null; }
}
async function showInbox(){
  chrome("Inbox");
  const d = await badge();
  if (!d) return;
  $("view").innerHTML = d.items.length ? `<div class="rowbtns" style="margin:0 0 12px"><button class="btn" id="allread"${d.unread ? "" : " disabled"}>Mark all read</button></div>
    <div class="list">${d.items.map(x => `<button class="row${x.read ? "" : " unread"}" data-in="${esc(x.id)}" data-conv="${esc(x.conv || "")}">
      <span class="t"><span class="kind ${esc(x.kind)}">${esc(x.kind)}</span>${esc(x.title)}</span>
      <span class="s">${ago(x.t)}${x.text ? " · " + esc(x.text.slice(0, 140)) : ""}</span></button>`).join("")}</div>`
    : `<div class="empty">Nothing yet. Store alerts and scheduled runs land here.</div>`;
  if ($("allread")) $("allread").onclick = async () => { await post("/api/inbox/read", {ids: null}); showInbox(); };
  $("view").querySelectorAll("[data-in]").forEach(b => b.onclick = async () => {
    try{ await post("/api/inbox/read", {ids: [b.dataset.in]}); } catch {}
    if (b.dataset.conv) location.hash = "conv=" + b.dataset.conv; else showInbox();
  });
}

/* ---------- invoices and BOLs, from a photo ---------- */
async function shrink(file){
  // the phone's photo, at most 2000 px on its long side, as JPEG: a fraction of the upload
  try{
    const bmp = await createImageBitmap(file, {imageOrientation: "from-image"});
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}
async function upload(file){
  $("scanMsg").textContent = "Sending the photo…";
  const blob = await shrink(file), fd = new FormData();
  fd.append("file", blob, (file.name || "photo").replace(/\.\w+$/, "") + ".jpg");
  const r = await fetch("/api/documents", {method: "POST", body: fd, credentials: "same-origin"});
  const d = await r.json().catch(() => ({}));
  if (!r.ok){ $("scanMsg").textContent = (d.detail && d.detail.message) || "It did not upload."; return; }
  location.hash = "doc=" + d.id;
}
const money = v => v == null ? "–" : Number(v).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const mark = ok => ok === true ? `<span style="color:var(--good)">✓</span>` : ok === false ? `<span style="color:var(--bad)">✗</span>` : `<span class="muted">–</span>`;
async function showScan(){
  chrome("Invoices and BOLs");
  let d;
  try{ d = await api("/api/documents"); } catch(e){ if (e.message !== "signin") $("view").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const st = d.settings;
  $("view").innerHTML = `${st.ready ? "" : `<div class="card" style="border-color:var(--warn)">${st.ollama
      ? `The vision model <b>${esc(st.model)}</b> is not in Ollama yet. Download it on the Mac: Settings → Reading invoices and BOLs.`
      : "Ollama is not running on the Mac, so photos cannot be read yet."}</div>`}
    <div class="rowbtns" style="margin:0 0 6px">
      <label class="btn go" style="flex:1;text-align:center;margin:0;color:var(--accent-ink)">Take a photo<input type="file" accept="image/*" capture="environment" id="cam" class="hidden"></label>
      <label class="btn" style="margin:0;color:var(--ink)">Choose one<input type="file" accept="image/*" id="pick" class="hidden"></label></div>
    <div class="muted" id="scanMsg" style="margin:0 0 12px">Flat, in good light, the whole page in the frame. Read on the Mac by ${esc(st.model)}; nothing leaves it.</div>
    ${d.documents.length ? `<div class="list">${d.documents.map(x => `<button class="row" data-doc="${esc(x.id)}">
        <span class="t">${esc(x.vendor || (x.status === "reading" ? "Reading…" : x.name || "Document"))}${x.number ? " · " + esc(x.number) : ""}</span>
        <span class="s">${x.status === "reading" ? "being read" : x.status === "error" ? "could not be read" : esc(x.doc_type || "")}
          ${x.date ? " · " + esc(x.date) : ""}${x.total != null ? " · $" + money(x.total) : ""}${x.problems ? ` · <span style="color:var(--bad)">${x.problems} to check</span>` : ""} · ${ago(x.t)}</span></button>`).join("")}</div>`
      : `<div class="empty">Photograph a vendor invoice or a fuel BOL. It is read into lines and totals, checked, and matched against your store's records.</div>`}`;
  ["cam", "pick"].forEach(id => $(id).onchange = e => { const f = e.target.files[0]; if (f) upload(f); });
  $("view").querySelectorAll("[data-doc]").forEach(b => b.onclick = () => { location.hash = "doc=" + b.dataset.doc; });
}
async function openDoc(id){
  chrome("Document", {back: true});
  const draw = async () => {
    let d;
    try{ d = await api("/api/documents/" + id); } catch(e){ if (e.message !== "signin") $("view").innerHTML = `<div class="err">${esc(e.message)}</div>`; clearInterval(S.timer); return; }
    if (location.hash !== "#doc=" + id){ clearInterval(S.timer); return; }
    const x = d.extracted || {};
    $("title").textContent = x.vendor || "Document";
    const img = `<a href="/api/documents/${esc(id)}/image" target="_blank"><img src="/api/documents/${esc(id)}/image" alt="The photo"
      style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--soft);margin-bottom:10px"></a>`;
    if (d.status === "reading"){
      $("view").innerHTML = img + `<div class="card"><div class="phase"><span class="dots"><i></i><i></i><i></i></span>Reading with ${esc(d.model)}…
        a minute or two on the Mac</div></div>`;
      return "reading";
    }
    clearInterval(S.timer);
    if (d.status === "error"){
      $("view").innerHTML = img + `<div class="card"><div class="err" style="margin:0">${esc(d.error)}</div>
        <div class="rowbtns"><button class="btn go" id="again">Read it again</button><button class="btn bad" id="del">Delete</button></div></div>`;
    } else {
      const head = [["Type", x.doc_type], ["Vendor", x.vendor], ["Number", x.number], ["BOL", x.bol_number], ["Date", x.date || x.date_printed],
        ["Subtotal", x.subtotal != null ? "$" + money(x.subtotal) : null], ["Tax", x.tax != null ? "$" + money(x.tax) : null],
        ["Total", x.total != null ? "$" + money(x.total) : null]].filter(r => r[1]);
      $("view").innerHTML = img + `<div class="card md" style="padding:10px 12px"><div class="tw"><table>${head.map(r => `<tr><th>${r[0]}</th><td>${esc(r[1])}</td></tr>`).join("")}</table></div></div>
        ${(x.fuel || []).length ? `<div class="card md" style="padding:10px 12px"><b>Fuel delivered</b><div class="tw"><table><tr><th>Grade</th><th>Gallons</th></tr>
          ${x.fuel.map(f => `<tr><td>${esc(f.grade)}</td><td class="n">${Number(f.gallons).toLocaleString()}</td></tr>`).join("")}</table></div></div>` : ""}
        ${(x.lines || []).length ? `<div class="card md" style="padding:10px 12px"><b>${x.lines.length} line${x.lines.length === 1 ? "" : "s"}</b><div class="tw"><table>
          <tr><th>Item</th><th>Qty</th><th>Price</th><th>Amount</th></tr>${x.lines.map(l => `<tr><td style="white-space:normal">${esc(l.description)}${l.item_code ? `<div class="muted" style="font-size:12px">${esc(l.item_code)}</div>` : ""}</td>
          <td class="n">${l.quantity != null ? l.quantity : "–"}</td><td class="n">${money(l.unit_price)}</td><td class="n">${money(l.amount)}</td></tr>`).join("")}</table></div></div>` : ""}
        <div class="card"><b>Checks</b>${(d.checks || []).concat(d.matches || []).map(c => `<div style="display:flex;gap:8px;margin-top:8px">
            <div style="width:16px">${mark(c.ok)}</div><div>${esc(c.check || c.what)}${c.detail ? `<div class="muted">${esc(c.detail)}</div>` : ""}</div></div>`).join("")
            || `<div class="muted" style="margin-top:6px">Nothing on the page to check.</div>`}
          <div class="muted" style="margin-top:10px;font-size:13px">Read by ${esc(d.model)} in ${d.seconds} s. Compare it with the photo before acting on it.</div></div>
        <div class="rowbtns"><button class="btn go" id="ask">Ask the Station analyst</button><button class="btn" id="again">Read it again</button>
          <button class="btn bad" id="del">Delete</button></div>`;
      $("ask").onclick = async () => {
        $("ask").disabled = true;
        try{ const r = await post(`/api/documents/${id}/ask`); location.hash = "conv=" + r.conversation.id; }
        catch(e){ $("ask").disabled = false; if (e.message !== "signin") alert(e.message); }
      };
    }
    $("again").onclick = async () => { try{ await post(`/api/documents/${id}/read`); } catch(e){ alert(e.message); } clearInterval(S.timer); S.timer = setInterval(draw, 3000); draw(); };
    $("del").onclick = async () => { if (!confirm("Delete this photo and what was read from it?")) return;
      try{ await api("/api/documents/" + id, {method: "DELETE"}); } catch {} location.hash = "scan"; };
  };
  clearInterval(S.timer);
  if (await draw() === "reading") S.timer = setInterval(draw, 3000);
}

/* ---------- what Muse knows about you ---------- */
async function showMe(){
  chrome("What Muse knows about you");
  let d;
  try{ d = await api("/api/profile"); } catch(e){ if (e.message !== "signin") $("view").innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  $("view").innerHTML = `<p class="muted" style="margin:0 0 12px">Every request starts with these lines. In a chat you can also say
      “remember: …” or “forget: …”.</p>
    ${d.facts.length ? d.facts.map(f => `<div class="card" style="padding:10px 12px;display:flex;gap:8px;align-items:flex-start">
        <div style="flex:1">${esc(f.text)}<div class="muted" style="font-size:12px">${f.by === "muse" ? "you told Muse" : "you wrote"}</div></div>
        <button class="icon-btn" data-del="${esc(f.id)}" aria-label="Remove" style="color:var(--bad)">Remove</button></div>`).join("")
      : `<div class="empty" style="padding:20px 10px">Nothing yet. Try: “My store is University Chevron #90877, open 24/7.”</div>`}
    <label for="fact">Add a fact</label><textarea id="fact" rows="2" maxlength="300" placeholder="In your own words"></textarea>
    <div class="rowbtns"><button class="btn go" id="addFact">Add</button></div><div class="err" id="ferr"></div>
    <div class="rowbtns" style="margin-top:28px"><button class="btn" id="signout">Sign out</button></div>`;
  $("addFact").onclick = async () => {
    try{ await post("/api/profile", {text: $("fact").value}); showMe(); } catch(e){ if (e.message !== "signin") $("ferr").textContent = e.message; }
  };
  $("view").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    try{ await api("/api/profile/" + b.dataset.del, {method: "DELETE"}); } catch {} showMe(); });
  $("signout").onclick = async () => { try{ await post("/api/auth/logout"); } catch {} showLogin(); };
}

(async function boot(){
  try{
    const me = await api("/api/auth/me");
    if (me.enabled && !me.user) return showLogin();
    S.me = me;
  } catch { return; }
  route(); badge(); setInterval(badge, 60000);
})();
</script>
